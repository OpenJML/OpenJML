name: 'OpenJML Release Test'
description: 'A composite action that runs the OpenJML release tests on an existing build'

## Presumes the current working folder is the one containing OpenJML, Specs, Solvers, JMLAnnotations etc.
## and that a release build has already been performed in OpenJML/OpenJMLsrc.

runs:
  using: 'composite'
  steps:
    - name: Test the build
      if: runner.os != 'Windows'
      shell: bash
      run: |
        make -C OpenJML/OpenJMLsrc release-test
    - name: Test the build on Windows
      if: runner.os == 'Windows'
      shell: wsl-bash {0}
      run: |
        # stdbuf forces line-buffered stdout/stderr so test progress appears in the
        # Actions output pane in real time rather than only at the end of the test run.
        # (wsl-bash pipes output through wsl.exe which is fully buffered by default)
        stdbuf -oL -eL make -C OpenJML/OpenJMLsrc release-test 2>&1
    - name: Test .bat scripts on Windows (native PowerShell)
      if: runner.os == 'Windows'
      shell: pwsh
      ## The folder name has a space, as install paths often do
      run: |
        OpenJML/OpenJMLTest/releaseTests/runtests.ps1 OpenJML/OpenJMLsrc/release-temp/openjml.zip 'temp bat'
