name: 'OpenJML Build'
description: 'A composite action that builds OpenJML in an existing check out'
inputs:
  test:
    description: 'Whether to run the release test'
    type: boolean
    required: true

runs:
  using: 'composite'
  steps:
    - name: Build OpenJML release on Windows
      if: runner.os == 'Windows'
      shell: wsl-bash {0}
      run: |
        pwd
        cd OpenJML/OpenJML21
        bash ./configure
        make release
        cd ../..
    - name: Build OpenJML release on non-Windows
      if: runner.os != 'Windows'
      shell: bash
      run: |
        cd OpenJML/OpenJML21
        bash OpenJML/O/configure
        make release
        cd ../..
    - name: Test the build
      if: ${{ inputs.test }}
      shell: bash
      run: |
        make -c OpenJML/OpenJML21 release-test
