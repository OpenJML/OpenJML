name: 'OpenJML Build'
description: 'A composite action that builds OpenJML in an existing check out'

## Presumes the current working folder is the one containsing OpenJML, Specs, Solvers, JMLAnnotations etc.

inputs:
  test:
    description: 'Whether to run the release test'
    type: boolean
    required: true

runs:
  using: 'composite'
  steps:
    ## The expected working directory is OpenJML, that is, the folder that holds OpenJMLsrc
    - name: Build OpenJML release on Windows
      if: runner.os == 'Windows'
      shell: wsl-bash {0}
      run: |
        cd OpenJML/OpenJMLsrc
        bash ./configure
        make release
        cd ..
    - name: Build OpenJML release on non-Windows
      if: runner.os != 'Windows'
      shell: bash
      run: |
        cd OpenJML/OpenJMLsrc
        bash ./configure
        make release
        cd ..
    - name: Test the build
      if: ${{ inputs.test == true }}
      shell: bash
      run: |
        make -C OpenJML/OpenJMLsrc release-test
    - name: Archive build artifact
      if: inputs.upload == 'true'
      shell: bash
      run: tar -czf openjml-build.tar.gz OpenJML/OpenJMLsrc/build/*/jdk OpenJML/OpenJMLsrc/jmlruntime.jar
    - name: Diagnose archive (debug)
      if: inputs.upload == 'true'
      shell: bash
      run: |
        echo "=== build/ contents ==="
        ls OpenJML/OpenJMLsrc/build/
        echo "=== Archive size ==="
        ls -lh openjml-build.tar.gz
        echo "=== First 30 archive entries ==="
        tar -tzf openjml-build.tar.gz | head -30
        echo "=== jvm.cfg in archive? ==="
        tar -tzf openjml-build.tar.gz | grep jvm.cfg || echo "NOT FOUND"
    - name: Upload build artifact
      if: inputs.upload == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: openjml-build-${{ inputs.os-label }}
        path: openjml-build.tar.gz
        retention-days: 1
