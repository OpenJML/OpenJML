name: 'OpenJML OS setup'
description: 'A composite action that sets up various OSs for building OpenJML releases'
runs:
  using: 'composite'
  steps:
    - name: Manually sync certs
      if: runner.os == 'Linux'
      shell: bash
      run: |
        ver=$(lsb_release -rs)
        if [ "$ver" = "22.04" ]; then cert-sync /etc/ssl/certs/ca-certificates.crt; fi
    - name: MacOSX additions
      if: runner.os == 'MacOS'
      shell: bash
      run: |
        brew install coreutils
        brew install autoconf
        echo 'sep=:' >> $GITHUB_ENV
        echo 'sepsemi=\\\;' >> $GITHUB_ENV
        ## Install Rosetta 2 so that arch -x86_64 works for the Intel build.
        softwareupdate --install-rosetta --agree-to-license || true

    - name: Linux additions
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install libxext-dev libxtst-dev libxrandr-dev libcups2-dev
        sudo apt-get install libfontconfig1-dev
        sudo apt-get install autoconf
        sudo apt-get install libasound2-dev
        sudo apt-get install libx11-dev libxext-dev libxrender-dev libxt-dev
        echo 'sep=:' >> $GITHUB_ENV

    - name: Setup WSL for Windows
      if: runner.os == 'Windows'
      uses: Vampire/setup-wsl@v6
      with:
        distribution: Ubuntu-24.04
        additional-packages: autoconf make zip unzip file cpio m4 openjdk-21-jdk
    - name: Set up MSVC environment for Windows
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64
    - name: WSL additions
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        echo 'sep=:' >> $env:GITHUB_ENV
        # Forward MSVC variables (set by ilammy/msvc-dev-cmd) into subsequent
        # wsl-bash steps.  WSLENV lists the Windows env-var names that WSL
        # inherits when the step launches; without this, they are invisible
        # inside WSL.  No /l flag: pass values unchanged (Windows format with
        # backslashes / semicolons) so configure can convert them with wslpath.
        $msvcVars = "VCINSTALLDIR:VCToolsInstallDir:INCLUDE:LIB:LIBPATH"
        $current = if ($env:WSLENV) { "$env:WSLENV`:$msvcVars" } else { $msvcVars }
        echo "WSLENV=$current" >> $env:GITHUB_ENV

    - name: setup python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'
    - name: Set up JDK21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'

