name: Nightly test of OpenJML

## This workflow runs all the unit and functionality tests on a build of the current developmenet environment for OpenJML
## that is, on the HEAD of branch dev-21 as it has been pushed to the github repo.
## The workflow is divided into jobs: the main job builds OpenJLM on each tested OS; then there are five jobs that do the actual testing.
## This separation allows the testing to be done in parallel across all 5 kinds of tests and all the OSes; if the 5 kinds of tests were executed sequentially
## a failure of one would prevent testing the rest.
## The drawback of this organization is that a failure to build one of the OSes prevents testing all of the tests for all OSes, because of how github 
## workflow job dependencies work. Another drawback is the need to setup the OS and checkout the repo for each of the five tests

## FIXME: The actions/checkout clones the entire OpenJML repo, when we only need version.txt and the .github folder. Put in something mxfore efficient.
## FIXME: The setting of PATH uses : where it might need ; for some OSes

on:
  workflow_dispatch:
  push:
    branches: [ dev-21 ]
#  schedule:
#    - cron: "0 0 * * *"

env:
  ## Branch to build from (both in OpenJML and Specs). (JMLAnnotation, Solvers, openjml.github.io are fixed to be 'master')
  ## The github branch that was pushed
  BRANCH: ${{ github.ref_name }}
  ## Name of folder containing openjml code within OpenJML repo. Ought to match the triggering branch in 'on push'.
  FOLDER: OpenJML21

jobs:

  ## This job defines a shared value for the matrix of OS runners to be used everywhere
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix-config: ${{ steps.set-matrix.outputs.matrix }} # Define output
    steps:
      - id: set-matrix
        run: |
          ## Edit the list here to add or remove OSes from being tested by this workflow
          echo 'matrix=[ "macos-14", "ubuntu-22.04", "ubuntu-latest" ]' >> "$GITHUB_OUTPUT"

  ## This job builds a development version of OpenJML as part of a trial release build
  ## and then uploads the built environment as a github artifact
  build:
    needs: prepare-matrix
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:  ${{ fromJson(needs.prepare-matrix.outputs.matrix-config) }}
      fail-fast: false

    steps:
    - name: Checkout actions
      uses: actions/checkout@v6
      with:
        ref: ${{ github.ref_name }}
    - name: OS setup
      uses: ./.github/actions/os-setup/
    - name: Checkout OpenJML
      uses: ./.github/actions/openjml-checkout/
      with:
        branch: ${{ github.ref_name }}
    - name: Build OpenJML
      uses: ./.github/actions/openjml-build/
      with:
        test: false
    - name: Test the release
      run: |
        make -C $FOLDER release-test
    - uses: pyTooling/upload-artifact@v6
      with:
        name: openjml-build-${{ matrix.os }}
        path: ..
        overwrite: true
        include-hidden-files: true

  ## This job downloads the built environment and runs the development release tests 
  release-test:
    needs: [prepare-matrix, build]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:  ${{ fromJson(needs.prepare-matrix.outputs.matrix-config) }}
      fail-fast: false

    steps:
    - name: Checkout actions 
      uses: actions/checkout@v6
    - name: OS setup
      uses: ./.github/actions/os-setup/
    - name: Download artifact
      uses: pyTooling/download-artifact@v6
      with:
        name: openjml-build-${{ matrix.os }}
        path: TEST
    - name: Run release tests
      run: |
        PATH=../../$FOLDER:$PATH make -C TEST/OpenJML/OpenJMLTest release-tests

  ## This job downloads the built environment and runs the unit tests 
  unit-test:
    needs: [prepare-matrix, build]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:  ${{ fromJson(needs.prepare-matrix.outputs.matrix-config) }}
      fail-fast: false

    steps:
    - name: Checkout actions 
      uses: actions/checkout@v6
    - name: OS setup
      uses: ./.github/actions/os-setup/
    - name: Download artifact
      uses: pyTooling/download-artifact@v6
      with:
        name: openjml-build-${{ matrix.os }}
        path: TEST
    - name: Run unit tests
      run: |
        PATH=../../$FOLDER:$PATH make -C TEST/OpenJML/OpenJMLTest unittests-par

  ## This job downloads the built environment and runs the tutorial tests
  tutorial-test:
    needs: [prepare-matrix, build]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:  ${{ fromJson(needs.prepare-matrix.outputs.matrix-config) }}
      fail-fast: false

    steps:
    - name: Checkout actions 
      uses: actions/checkout@v6
    - name: OS setup
      uses: ./.github/actions/os-setup/
    - name: Download artifact
      uses: pyTooling/download-artifact@v6
      with:
        name: openjml-build-${{ matrix.os }}
        path: TEST
    - name: Run tutorial tests
      run: |
        PATH=../../OpenJML/$FOLDER:$PATH make -C TEST/OpenJML/OpenJMLTest tutorial-tests-git

  ## This job downloads the built environment and then runs the json tests
  json-test:
    needs: [prepare-matrix, build]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:  ${{ fromJson(needs.prepare-matrix.outputs.matrix-config) }}
      fail-fast: false

    steps:
    - name: Checkout actions 
      uses: actions/checkout@v6
    - name: OS setup
      uses: ./.github/actions/os-setup/
    - name: Download artifact
      uses: pyTooling/download-artifact@v6
      with:
        name: openjml-build-${{ matrix.os }}
        path: TEST
    - name: Run json tests
      run: |
        PATH=../../../$FOLDER:$PATH make -C TEST/OpenJML/OpenJMLTest json-tests

  ## This job downloads the built environment and then runs the userguide tests
  ## (which involves cloning the userguide and its examples from OverLeaf)
  userguide-test:
    needs: [prepare-matrix, build]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:  ${{ fromJson(needs.prepare-matrix.outputs.matrix-config) }}
      fail-fast: false

    steps:
    - name: Checkout actions 
      uses: actions/checkout@v6
    - name: OS setup
      uses: ./.github/actions/os-setup/
    - name: Download artifact
      uses: pyTooling/download-artifact@v6
      with:
        name: openjml-build-${{ matrix.os }}
        path: TEST
    - name: Run userguide tests
      run: |
        PATH=../../../../$FOLDER:$PATH make -C TEST/OpenJML/OpenJMLTest userguide-tests-released

