name: Nightly test of OpenJML

## This workflow runs all the unit and functionality tests on a build of the current development environment for OpenJML
## that is, on the HEAD of branch dev-21 as it has been pushed to the github repo.
## The workflow runs each designated OS as a separate matrixed job. The job does a build and then sequentially runs a number of tests.
##
## The disadvantage of this design is that the various test tasks are run sequentially. If one fails, the rest are not tested.
## But if we mark them to continue on error in some way, they do not show up as failed in the workflow summary.
##
## A different design would put the test tasks in separate jobs, which could then run concurrently. However this requires
## either doing a full build for each of these test tasks, which is time consuming, or uploading and downloading a github artifact that
## contained the full built repo checkout. This latter 'worked' but frequently failed because the artifacts took too much space.
##
## As a compromise, the workflow uses a build job (per OS) that uploads the built JDK as an artifact,
## and separate test jobs (othertests, unittests1/2/3) that download the artifact instead of rebuilding.

## Note: PATH adjustments below use ':' (Linux/macOS/WSL). Windows jobs in these steps are not yet supported.

on:
  workflow_dispatch:
  push:
    branches: [ dev-21 ]
#  schedule:
#    - cron: "0 0 * * *"

env:
  ## Branch to build from (both in OpenJML and Specs). (JMLAnnotation, Solvers, openjml.github.io are fixed to be 'master')
  ## The github branch that was pushed
  BRANCH: ${{ github.ref_name }}
  ## Name of folder containing openjml code within OpenJML repo.
  FOLDER: OpenJMLsrc

jobs:

  export-matrix:
    runs-on: ubuntu-24.04
    outputs:
      oses: ${{ steps.export.outputs.oslist }}
    steps:
    - id: export
      run: |
        ## Edit the list of OSes here
        ## macos-14 is used twice: once natively (ARM64) and once under Rosetta 2 (x86_64)
        echo 'oslist=[ {"os":"macos-14","label":"macos-arm64","arch":"default"}, {"os":"macos-14","label":"macos-x86_64","arch":"x86_64"}, {"os":"ubuntu-24.04","label":"ubuntu-24.04","arch":"default"}, {"os":"ubuntu-24.04-arm","label":"ubuntu-arm64","arch":"default"}, {"os":"windows-latest","label":"windows","arch":"default"} ]' >> "$GITHUB_OUTPUT"
    
  ## This job builds OpenJML once per OS and uploads the built JDK as an artifact
  build:
    needs: export-matrix
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include: ${{ fromJson(needs.export-matrix.outputs.oses) }}
      fail-fast: false

    steps:
    - name: Checkout actions
      uses: actions/checkout@v6
      with:
        sparse-checkout: ./.github
        path: ACTIONS
    - name: OS setup
      uses: ./ACTIONS/.github/actions/os-setup/
    - name: Checkout OpenJML
      uses: ./ACTIONS/.github/actions/openjml-checkout/
      with:
        branch: ${{ github.ref_name }}
    - name: Build OpenJML and upload artifact
      uses: ./ACTIONS/.github/actions/openjml-build/
      with:
        upload: 'true'
        os-label: ${{ matrix.label }}
        arch: ${{ matrix.arch }}

  ## This job downloads the pre-built artifact and runs various non-unit tests
  othertests:
    ## To revert to self-contained jobs (no artifact sharing): remove 'build' from needs,
    ## comment out the Download step below, and uncomment the Build step below.
    needs: [ export-matrix, build ]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include: ${{ fromJson(needs.export-matrix.outputs.oses) }}
      fail-fast: false

    steps:
    - name: Checkout actions
      uses: actions/checkout@v6
      with:
        sparse-checkout: ./.github
        path: ACTIONS

    - name: OS setup
      uses: ./ACTIONS/.github/actions/os-setup/

    - name: Checkout OpenJML
      uses: ./ACTIONS/.github/actions/openjml-checkout/
      with:
        branch: ${{ github.ref_name }}

    #- name: Build OpenJML  ## uncomment (and remove Download step) to revert to self-contained
    #  uses: ./ACTIONS/.github/actions/openjml-build/
    - name: Download build artifact
      uses: ./ACTIONS/.github/actions/openjml-download/
      with:
        os-label: ${{ matrix.label }}

    - name: Variable
      run: |
        echo "failures=" >> $GITHUB_ENV

    - name: Run userguide tests
      run: |
        cd OpenJML/OpenJMLTest
        git clone https://git:${{ secrets.OVERLEAF_TOKEN }}@git.overleaf.com/620c2512d552cc226f5f4c94
        cd 620c2512d552cc226f5f4c94
        chmod +x test-userguide-examples
        ./test-userguide-examples || echo "failures=$failures userguide tests failed." >> $GITHUB_ENV

    - name: Run release tests
      run: |
        PATH="$GITHUB_WORKSPACE/OpenJML/$FOLDER:$PATH" make -C OpenJML/OpenJMLTest release-tests || echo "failures=$failures release tests failed." >> $GITHUB_ENV

    - name: Run tutorial tests
      run: |
        PATH="$GITHUB_WORKSPACE/OpenJML/$FOLDER:$PATH" make -C OpenJML/OpenJMLTest tutorial-tests-git || echo "failures=$failures tutorial tests failed." >> $GITHUB_ENV

    - name: Run json tests
      run: |
        PATH="$GITHUB_WORKSPACE/OpenJML/$FOLDER:$PATH" make -C OpenJML/OpenJMLTest json-tests || echo "failures=$failures json tests failed." >> $GITHUB_ENV

    - name: Run LSP server tests
      run: |
        make -C OpenJML/OpenJMLlsp all || echo "failures=$failures LSP server tests failed." >> $GITHUB_ENV

    - name: Report
      run: |
        if [ -z "$failures" ] ; then echo All tests OK; exit 0; else echo $failures; exit 1; fi
        

  ## These jobs download the pre-built artifact and run subsets of the unit tests in parallel
  unittests1:
    ## To revert to self-contained jobs (no artifact sharing): remove 'build' from needs,
    ## comment out the Download step below, and uncomment the Build step below.
    needs: [ export-matrix, build ]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include: ${{ fromJson(needs.export-matrix.outputs.oses) }}
      fail-fast: false

    steps:
    - name: Checkout actions
      uses: actions/checkout@v6
      with:
        sparse-checkout: ./.github
        path: ACTIONS
    - name: OS setup
      uses: ./ACTIONS/.github/actions/os-setup/
    - name: Checkout OpenJML
      uses: ./ACTIONS/.github/actions/openjml-checkout/
      with:
        branch: ${{ github.ref_name }}
    #- name: Build OpenJML  ## uncomment (and remove Download step) to revert to self-contained
    #  uses: ./ACTIONS/.github/actions/openjml-build/
    - name: Download build artifact
      uses: ./ACTIONS/.github/actions/openjml-download/
      with:
        os-label: ${{ matrix.label }}

    - name: Run unit tests
      run: |
        PATH="$GITHUB_WORKSPACE/OpenJML/$FOLDER:$PATH" START=1 LINES=40 make -C OpenJML/OpenJMLTest unittests-par 

  unittests2:
    ## To revert to self-contained jobs (no artifact sharing): remove 'build' from needs,
    ## comment out the Download step below, and uncomment the Build step below.
    needs: [ export-matrix, build ]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include: ${{ fromJson(needs.export-matrix.outputs.oses) }}
      fail-fast: false

    steps:
    - name: Checkout actions
      uses: actions/checkout@v6
      with:
        sparse-checkout: ./.github
        path: ACTIONS
    - name: OS setup
      uses: ./ACTIONS/.github/actions/os-setup/
    - name: Checkout OpenJML
      uses: ./ACTIONS/.github/actions/openjml-checkout/
      with:
        branch: ${{ github.ref_name }}
    #- name: Build OpenJML  ## uncomment (and remove Download step) to revert to self-contained
    #  uses: ./ACTIONS/.github/actions/openjml-build/
    - name: Download build artifact
      uses: ./ACTIONS/.github/actions/openjml-download/
      with:
        os-label: ${{ matrix.label }}

    - name: Run unit tests
      run: |
        PATH="$GITHUB_WORKSPACE/OpenJML/$FOLDER:$PATH" START=41 LINES=30 make -C OpenJML/OpenJMLTest unittests-par 

  unittests3:
    ## To revert to self-contained jobs (no artifact sharing): remove 'build' from needs,
    ## comment out the Download step below, and uncomment the Build step below.
    needs: [ export-matrix, build ]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include: ${{ fromJson(needs.export-matrix.outputs.oses) }}
      fail-fast: false

    steps:
    - name: Checkout actions
      uses: actions/checkout@v6
      with:
        sparse-checkout: ./.github
        path: ACTIONS
    - name: OS setup
      uses: ./ACTIONS/.github/actions/os-setup/
    - name: Checkout OpenJML
      uses: ./ACTIONS/.github/actions/openjml-checkout/
      with:
        branch: ${{ github.ref_name }}
    #- name: Build OpenJML  ## uncomment (and remove Download step) to revert to self-contained
    #  uses: ./ACTIONS/.github/actions/openjml-build/
    - name: Download build artifact
      uses: ./ACTIONS/.github/actions/openjml-download/
      with:
        os-label: ${{ matrix.label }}

    - name: Run unit tests
      run: |
        PATH="$GITHUB_WORKSPACE/OpenJML/$FOLDER:$PATH" START=71 LINES=60 make -C OpenJML/OpenJMLTest unittests-par 
