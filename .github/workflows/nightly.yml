name: Nightly test of  OpenJML

on:
  workflow_dispatch:
  push:
    branches: [ dev-21 ]
#  schedule:
#    - cron: "0 0 * * *"

env:
  ## Branch to build from (both in OpenJML and Specs). (JMLAnnotation, Solvers, openjml.github.io are fixed to be 'master')
  ## The github branch that was pushed
  BRANCH: ${{ github.ref_name }}
  ## Name of folder containing openjml code within OpenJML repo. Ought to match the triggering branch in 'on push'.
  FOLDER: OpenJML21

jobs:

  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix-config: ${{ steps.set-matrix.outputs.matrix }} # Define output
    steps:
      - id: set-matrix
        run: |
          # Example: read from a file or generate JSON
          echo "::set-output name=matrix::[{\"os\":\"[ ubuntu-22.04, macos-14 ]\"}]"

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        ## Just use one instance of each kind of OS
        os: [ ubuntu-22.04, macos-14 ]
      fail-fast: false

    steps:
    - name: Checkout actions
      uses: actions/checkout@v4
    - name: OS setup
      uses: ./.github/actions/os-setup/
    - name: Checkout OpenJML
      uses: ./.github/actions/openjml-checkout/
      with:
        branch: ${{ github.ref_name }}
    - name: Build OpenJML
      uses: ./.github/actions/openjml-build/
      with:
        test: false
    - name: Test the release
      run: |
        make -C OpenJML/$FOLDER release-test || true
    - uses: pyTooling/upload-artifact@v6
      with:
        name: openjml-build-${{ matrix.os }}
        path: OpenJML
        overwrite: true

    - name: Run userguide tests
      run: |
        PATH=../../../../$FOLDER:$PATH make -C OpenJML/OpenJMLTest userguide-tests-released || true

    - name: Run unit tests
      run: |
        ##make -C OpenJML/OpenJMLTest unittests-par
        ##the following would run all the above test steps in one step
        ##make -C OpenJML/OpenJMLTest openjml-test-git

  tutorial-test:
    needs: [ build, prepare-matrix ]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        ## Just use one instance of each kind of OS
        os: ${{ fromJson(needs.prepare-matrix.outputs.matrix-config) }}
        ##os: [ ubuntu-22.04, macos-14 ]
      fail-fast: false

    steps:
    - name: Checkout actions 
      uses: actions/checkout@v4
    - name: OS setup
      uses: ./.github/actions/os-setup/
    - name: Upload
      uses: pyTooling/download-artifact@v6
      with:
        name: openjml-build-${{ matrix.os }}
        path: OpenJML
    - name: Run tutorial tests
      run: |
        PATH=../../OpenJML/$FOLDER:$PATH make -C OpenJML/OpenJMLTest tutorial-tests-git

  json-test:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        ## Just use one instance of each kind of OS
        os: [ ubuntu-22.04, macos-14 ]
      fail-fast: false

    steps:
    - name: Checkout actions 
      uses: actions/checkout@v4
    - name: OS setup
      uses: ./.github/actions/os-setup/
    - name: Upload
      uses: pyTooling/download-artifact@v6
      with:
        name: openjml-build-${{ matrix.os }}
        path: OpenJML
    - name: data
      run: |
        ls
        pwd
        ls ..
    - name: Run json tests
      run: |
        PATH=../../../$FOLDER:$PATH make -C OpenJML/OpenJMLTest json-tests

  userguide-test:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        ## Just use one instance of each kind of OS
        os: [ ubuntu-22.04, macos-14 ]
      fail-fast: false

    steps:
    - name: Checkout actions 
      uses: actions/checkout@v4
    - name: OS setup
      uses: ./.github/actions/os-setup/
    - name: Upload
      uses: pyTooling/download-artifact@v6
      with:
        name: openjml-build-${{ matrix.os }}
        path: OpenJML
    - name: Run userguide tests
      run: |
        PATH=../../../../$FOLDER:$PATH make -C OpenJML/OpenJMLTest userguide-tests-released

