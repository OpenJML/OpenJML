name: Build OpenJML

on:
  workflow_dispatch:
  push:
    branches: [ dev-21, master-21 ]

env:
  ## Branch to build from (both in OpenJML and Specs). (JMLAnnotation, Solvers, openjml.github.io are fixed to be 'master')
  ## The github branch that was pushed
  BRANCH: ${{ github.ref_name }}
  ## Name of folder containing openjml code within OpenJML repo. Ought to match the triggering branch in 'on push'.
  FOLDER: OpenJML21

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout OpenJML
      run: |
        git config --global core.autocrlf input
        git clone -b $BRANCH --depth 1 https://github.com/OpenJML/OpenJML
    - name: Check most recent release
      run: |
        export ver=`cat OpenJML/version.txt`
        ( curl --silent "https://api.github.com/repos/OpenJML/OpenJML/releases" --header 'Authorization: token ${{ secrets.GITHUB_TOKEN }}' | grep "\"name\": \"OpenJML $ver\"" ) && echo "Version $ver already exists" && false
        echo "No prior release found for version " $ver

    - name: Create the GitHub release
      ## Do this just once -- not for every element of the matrix
      run: |
        cd OpenJML
        export ver=`cat version.txt`
        echo Version $ver from branch $BRANCH
        curl -s -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -d "{\"tag_name\":\"$ver\", \"target_commitish\":\"$BRANCH\", \"name\":\"OpenJML $ver\", \"draft\":true, \"body\":\"Publishing release $ver\"}" "https://api.github.com/repos/OpenJML/OpenJML/releases"
        export id=`curl --silent "https://api.github.com/repos/OpenJML/OpenJML/releases" --header 'Authorization: token ${{ secrets.GITHUB_TOKEN }}' | grep --max-count 1 '"id":' | sed -e 's/.*: //' -e 's/,//'`
        echo Created release with id $id

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        ## Omitting ubuntu-24 because the cert-sync command fails
        os: [ ubuntu-22.04, macos-14 ]
      fail-fast: false

    steps:
    - name: Checkout actions
      uses: actions/checkout@v4
    - name: OS setup
      uses: ./.github/actions/os-setup/
    - name: Checkout OpenJML
      uses: ./.github/actions/openjml-checkout/
      with:
        branch: $BRANCH
    - name: Build OpenJML
      uses: ./.github/actions/openjml-build/
      with:
        test: true

    ## Only need 'prepare' to have concluded by this point in the job
    - name: Wait for prepare
      uses: yogeshlonkar/wait-for-jobs@v0
      with:
        gh-token: ${{ secrets.GITHUB_TOKEN }}
        jobs: prepare 
        interval: '2000'
        ttl: '10'

    - name: Copy zip for upload
      run: |
        export ver=`cat OpenJML/version.txt`
        export f=openjml-${{ matrix.os }}-${ver}.zip
        cp OpenJML/OpenJML21/release-temp/*.zip $f
        ls
        pwd

    - name: github upload
      uses: pyTooling/upload-artifact@v6
      with:
        name: openjml-release-${{ matrix.os }}
        path: '*.zip'
        overwrite: true
        include-hidden-files: true

    - name: Copy OpenJML build into GitHub release
      run: |
        cd OpenJML
        export ver=`cat version.txt`
        cd $FOLDER/release-temp
        export f=openjml-${{ matrix.os }}-${ver}.zip
        mv *.zip $f
        ls -la $f
        export id=`curl --silent "https://api.github.com/repos/OpenJML/OpenJML/releases" --header 'Authorization: token ${{ secrets.GITHUB_TOKEN }}' | grep --max-count 1 '"id":' | sed -e 's/.*: //' -e 's/,//'`
        export upload_url="https://uploads.github.com/repos/OpenJML/OpenJML/releases/$id/assets"
        echo Uploading $f to id $id at url $upload_url
        curl -s -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -H "Content-Type: application/zip" --data-binary @$f  "$upload_url?name=$f&label=$f" 
    - name: Check current GitHub release number against version.txt
      run: |
        export ver=`cat OpenJML/version.txt`
        export tag=`curl --silent --header 'Authorization: token ${{ secrets.GITHUB_TOKEN }}' "https://api.github.com/repos/OpenJML/OpenJML/releases" | grep --max-count 1 tag_name | sed -e 's/.*: \"//' -e 's/\",//'`
        echo $ver $tag
        test "$ver" = "$tag" || echo "Version $ver from version.txt does not match the release tag, which is $tag"

  upload:
    needs: [ prepare, build ]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        ## Omitting ubuntu-24 because the cert-sync command fails
        os: [ ubuntu-22.04, macos-14 ]
      fail-fast: false
    steps:
    - name: Download
      uses: pyTooling/download-artifact@v6
      with:
        name: openjml-release-${{ matrix.os }}
    - name: check
      run: |
        ls -la .
        pwd
        ls -la openjml-*.zip
