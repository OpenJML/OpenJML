name: Windows test debugging

## Runs the unit tests on Windows only, to develop the Windows support of the Nightly's test jobs (which
## do not yet run there) without spending a run on every platform. It runs on a push to the ci-windows
## branch; Specs comes from dev-21. The other workflows do not run on that branch.
##
## On Windows, OpenJML is a Windows build used from WSL (as in openjml-build and openjml-release-test):
## the test steps run under wsl-bash, so the test scripts see Linux paths while java.exe etc. are
## Windows programs started through WSL interop.

on:
  push:
    branches: [ ci-windows ]

env:
  FOLDER: OpenJMLsrc

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 240
    ## Every run: step uses bash in WSL unless it says otherwise (the Nightly could set this per platform:
    ## shell: ${{ matrix.label == 'windows' && 'wsl-bash {0}' || 'bash' }})
    defaults:
      run:
        shell: wsl-bash {0}
    steps:
    - name: Checkout actions
      uses: actions/checkout@v6
      with:
        sparse-checkout: ./.github
        path: ACTIONS
    - name: OS setup
      uses: ./ACTIONS/.github/actions/os-setup/
    - name: Checkout OpenJML
      uses: ./ACTIONS/.github/actions/openjml-checkout/
      with:
        branch: ${{ github.ref_name }}
        specs-branch: dev-21
        os-label: windows
    - name: Build OpenJML
      uses: ./ACTIONS/.github/actions/openjml-build/
      with:
        os-label: windows

    ## Per-method ESC cost with and without --pipeline. Run 38257384690 found ~6.8 s per trivial method
    ## on Windows (0.6 s on macOS), about 15 ms per solver command; pipelining should remove most of it.
    - name: ESC timing, --pipeline on and off
      continue-on-error: true
      run: |
        set +e
        mkdir -p timing; cd timing
        { echo "public class G20 {"; for i in $(seq 20); do echo "  //@ requires 0 < x && x < 1000; ensures \result > x;"; echo "  public int m$i(int x) { return x + 1; }"; done; echo "}"; } > G20.java
        O=../OpenJML/OpenJMLsrc/openjml
        TIMEFORMAT="TIME esc-20-methods-pipeline %R s"; time $O --esc G20.java
        TIMEFORMAT="TIME esc-20-methods-nopipeline %R s"; time $O --esc --no-pipeline G20.java

    ## The release launchers with a Linux and a Windows JDK under WSL (#1007)
    - name: Launcher JDK test
      continue-on-error: true
      run: OpenJML/OpenJMLTest/scripttests/launcher-jdk-test

    ## What the unit-test scripts will find: they are bash scripts run in WSL, using the Windows build
    ## (continue-on-error: wsl-bash stops a step at a failing command, and a failure here must not
    ## keep the tests from running)
    - name: Environment for the unit tests
      if: always()
      continue-on-error: true
      run: |
        set -x
        # Windows environment variables reach WSL only if listed in WSLENV
        echo "WSLENV=$WSLENV GITHUB_WORKSPACE=${GITHUB_WORKSPACE:-<unset>} FOLDER=${FOLDER:-<unset>} GITHUB_ENV=${GITHUB_ENV:-<unset>}"
        uname -a; pwd; echo "PATH=$PATH"
        ls -d OpenJML/OpenJMLsrc/build/*/jdk/bin 2>&1
        ls OpenJML/OpenJMLsrc/build/*/jdk/bin/ 2>&1 | grep -E '^java' || true
        ls OpenJML/OpenJMLsrc/build/*/jdk/bin/java OpenJML/OpenJMLsrc/build/*/jdk/bin/java.exe 2>&1 || true
        OpenJML/OpenJMLsrc/os-name.sh || true
        which java java.exe javac javac.exe 2>&1 || true
        ls Solvers Solvers/Solvers-windows 2>&1 | head -20 || true
        cat /etc/wsl.conf 2>&1 || true

    ## A few suites that cover the command line, ESC (solvers) and RAC; widen once these run
    - name: Run unit tests
      run: |
        cd OpenJML/OpenJMLTest/unittests
        # stdbuf: line-buffered output, so progress appears as it happens (see openjml-release-test)
        PATH="$(cd ../../OpenJMLsrc && pwd):$PATH" stdbuf -oL -eL ./runpar compiler escgeneric escfiles racnew 2>&1

    - name: Report test failures and upload test logs
      if: always()
      uses: ./ACTIONS/.github/actions/openjml-test-report/
      with:
        job-name: windows-debug
        os-label: windows
